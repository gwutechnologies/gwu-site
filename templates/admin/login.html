<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login – GWU Technologies</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/GWU LOGObgr.png') }}">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #110609;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .login-box {
      background: white;
      border-radius: 20px;
      padding: 3rem;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4)
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 900;
      color: #1A0A0E;
      margin-bottom: 0.25rem
    }

    .logo span {
      color: #C8102E
    }

    .logo img {
      height: 56px;
      width: auto;
      display: block
    }

    .sub {
      color: #9CA3AF;
      font-size: 0.85rem;
      margin-bottom: 2rem
    }

    .flash {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 1.5rem
    }

    .fg {
      margin-bottom: 1.25rem
    }

    .fg label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #1A0A0E;
      margin-bottom: 0.4rem
    }

    .fg input {
      width: 100%;
      padding: 0.875rem;
      border: 1.5px solid #f0e8ea;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color .3s
    }

    .fg input:focus {
      border-color: #C8102E;
      box-shadow: 0 0 0 3px rgba(200, 16, 46, .08)
    }

    .btn {
      width: 100%;
      padding: 1rem;
      background: #C8102E;
      color: white;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer
    }

    .btn:hover {
      background: #9B0E24
    }

    .hint {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: #9CA3AF;
      background: #f9f9f9;
      padding: .75rem;
      border-radius: 8px
    }

    .hint strong {
      color: #C8102E
    }
  </style>
</head>

<body>
  <div class="login-box">
    <div class="logo"><img src="{{ (( '../' * request.path.strip('/').count('/')) or './') ~ 'static/assets/GWU LOGObgr.png' }}" alt="GWU Technologies">
    </div>
    <div class="sub">Admin Panel · Secure Access</div>
    {% with messages = get_flashed_messages() %}{% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}{%
    endwith %}
    <form method="POST">
      <div class="fg"><label>Username</label><input type="text" name="username" placeholder="admin" required></div>
      <div class="fg"><label>Password</label><input type="password" name="password" placeholder="Enter password"
          required></div>
      <button type="submit" class="btn">Sign In →</button>
    </form>
    <div class="hint">Default: <strong>admin</strong> / <strong>GWU@2026</strong></div>
  </div>
</body>

</html>
