<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GWU Technologies{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/gwu-logo-black.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:ital,wght@0,500;0,600;0,700;1,600&family=Orbitron:wght@500;700;900&family=DM+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
    {% block extra_css %}{% endblock %}
    
    {# Vercel Web Analytics #}
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    
    {# Vercel Speed Insights #}
    <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</head>

<body>
    <div class="cursor" id="cursor"></div>
    <div class="cursor-follower" id="cursorFollower"></div>
    {% block loader %}{% endblock %}
    {% include 'partials/nav.html' %}
    {% block content %}{% endblock %}
    {% include 'partials/footer.html' %}
    <script src="/static/js/main.js"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
